name: Windows-RDP-Pinggy
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repo Context
      uses: actions/checkout@v4

    - name: Setup RDP and System User Account
      run: |
        # Enable Remote Desktop Connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Configure local user account credentials
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force)

    - name: Launch Zero-Login Raw TCP Tunnel
      run: |
        # Ensure separate clean log files exist for both streams
        New-Item -ItemType File -Path "C:\tunnel.log" -Force | Out-Null
        New-Item -ItemType File -Path "C:\tunnel_err.log" -Force | Out-Null
        
        # Fixed: Redirect output and errors to separate, unique files to satisfy PowerShell constraints
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel_err.log"
        
        Write-Host "⏳ Initializing network routes... pulling initial connection log streams:"
        Write-Host "=========================================================================="
        
        # Loop to monitor the logs for the incoming server address details
        $initTimeout = 0
        while ($initTimeout -lt 15) {
            Start-Sleep -Seconds 2
            
            # Print standard output if it contains data
            if (Test-Path "C:\tunnel.log") {
                $outData = Get-Content "C:\tunnel.log"
                if ($outData) {
                    Write-Host "--- Standard Output ---"
                    $outData | Select-Object -Last 10
                }
            }
            
            # Print error data if the connection throws warnings
            if (Test-Path "C:\tunnel_err.log") {
                $errData = Get-Content "C:\tunnel_err.log"
                if ($errData) {
                    Write-Host "--- Connection Info/Errors ---"
                    $errData | Select-Object -Last 10
                }
            }
            
            $initTimeout++
        }
        
        Write-Host "=========================================================================="
        Write-Host "🔒 Active keep-alive loop engaged. VM will stay alive for up to 6 hours."
        
        # Continuous Anti-Idle Heartbeat Loop to prevent early container shutdown
        $runtimeMinutes = 0
        while ($true) {
            Start-Sleep -Seconds 300
            $runtimeMinutes += 5
            Write-Host "⏱️ System Heartbeat: Runner connection has been active for $runtimeMinutes minutes."
        }

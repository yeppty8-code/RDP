name: Windows-RDP-Cloudflare
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repo Context
      uses: actions/checkout@v4

    - name: Setup RDP and System User Account
      run: |
        # Enable Remote Desktop Connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Configure local user account credentials
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force)

    - name: Download and Launch Cloudflare Tunnel
      run: |
        # Force modern secure transport protocols
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13

        # Fixed: Bypassing GitHub entirely by hitting Cloudflare's stable primary download CDN mirror
        $DownloadUrl = "https://github.com"
        
        # Cleanly pull the file down using standard web streams mimicking edge browsers
        Invoke-WebRequest -Uri $DownloadUrl -OutFile "cloudflared.exe" -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

        # Verify file presence and print size to ensure payload delivery integrity
        if (Test-Path "cloudflared.exe") {
            $fileSize = (Get-Item "cloudflared.exe").Length / 1MB
            Write-Host "✅ Verified Download File Size: $fileSize MB"
        } else {
            Write-Error "❌ Fatal Error: File payload failed to write completely to target location."
            exit 1
        }
        
        # Spawn the tunnel headlessly as a background task forwarding local RDP ports
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel_err.log"
        
        Write-Host "⏳ Initializing network routes... giving Cloudflare 15 seconds to generate your URL link."
        Start-Sleep -Seconds 15
        
        # Pull logs to extract the unique public .trycloudflare.com entry url string
        if (Test-Path "C:\tunnel_err.log") {
            Get-Content "C:\tunnel_err.log" | Select-String "trycloudflare.com" | Select-Object -First 1
        }

name: Windows-RDP-Pinggy
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repo Context
      uses: actions/checkout@v4

    - name: Setup RDP and System User Account
      run: |
        # Enable Remote Desktop Connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Configure local user account credentials
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force)

    - name: Launch Zero-Login Raw TCP Tunnel
      run: |
        # Ensure a clean log file exists
        New-Item -ItemType File -Path "C:\tunnel.log" -Force | Out-Null
        
        # Run SSH with absolute strict host checking bypasses and error routing merged into one stream
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel.log"
        
        Write-Host "⏳ Initializing network routes... pulling initial connection log streams:"
        Write-Host "=========================================================================="
        
        # Loop for 20 seconds to give the tunnel time to securely register and output the URL
        $initTimeout = 0
        while ($initTimeout -lt 10) {
            Start-Sleep -Seconds 2
            if (Test-Path "C:\tunnel.log") {
                Get-Content "C:\tunnel.log" | Select-Object -Last 10
            }
            $initTimeout++
        }
        
        Write-Host "=========================================================================="
        Write-Host "🔒 Active keep-alive loop engaged. VM will stay alive for up to 6 hours."
        Write-Host "💡 Pro-Tip: To look at your connection URL at any time, review the top of this step's log."
        
        # Continuous Anti-Idle Loop: Sends a timestamp heartbeat every 5 minutes to prevent timeout
        $runtimeMinutes = 0
        while ($true) {
            Start-Sleep -Seconds 300
            $runtimeMinutes += 5
            Write-Host "⏱️ System Heartbeat: Runner connection has been active for $runtimeMinutes minutes."
        }

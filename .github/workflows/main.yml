name: Windows-RDP-Pinggy
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repo Context
      uses: actions/checkout@v4

    - name: Setup RDP and System User Account
      run: |
        # Enable Remote Desktop Connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Configure local user account credentials
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force)

    - name: Launch Zero-Login Raw TCP Tunnel
      run: |
        # Spawn the interactive raw TCP connection over standard SSH tunnels
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel_err.log"
        
        Write-Host "⏳ Establishing dynamic endpoint routing matrix..."
        
        # Keep looping to look for the generated link address string inside the log streams
        $timeout = 0
        while ($timeout -lt 12) {
            Start-Sleep -Seconds 2
            if (Test-Path "C:\tunnel.log") {
                $logContent = Get-Content "C:\tunnel.log"
                if ($logContent -match "pinggy.link") {
                    Write-Host "=================================================="
                    Write-Host "🚀 DEPLOYMENT SUCCESSFUL! CONNECT VIA DETAILS BELOW:"
                    $logContent | Select-String "pinggy.link"
                    Write-Host "=================================================="
                    break
                }
            }
            $timeout++
        }

        Write-Host "🔒 Keep-Alive loop engaged. The server will remain accessible for up to 6 hours."
        Write-Host "🛑 To manually shut down this system runner, cancel the workflow execution from your GitHub UI."
        
        # Infinite execution block to prevent the GitHub Actions container environment from terminating
        while ($true) {
            Start-Sleep -Seconds 60
        }

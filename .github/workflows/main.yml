name: Windows-RDP-Pinggy
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repo Context
      uses: actions/checkout@v4

    - name: Setup RDP and System User Account
      run: |
        # Enable Remote Desktop Connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Configure local user account credentials
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "MyRobloxBot123!" -AsPlainText -Force)

    - name: Launch Zero-Login Raw TCP Tunnel
      run: |
        # Use built-in SSH to tunnel raw RDP port 3389 without creating an account or downloading files
        # The 'StrictHostKeyChecking=no' parameter skips confirmation prompts automatically
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel_err.log"
        
        Write-Host "⏳ Initializing zero-login network routes... giving tunnel 10 seconds to stabilize."
        Start-Sleep -Seconds 10
        
        # Print the logs to see your generated public URL and custom TCP port destination
        if (Test-Path "C:\tunnel.log") {
            Get-Content "C:\tunnel.log"
        }
